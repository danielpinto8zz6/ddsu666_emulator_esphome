    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  - platform: template
    internal: false
    id: emu_pv_voltage
    name: "PV Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 1

  - platform: template
    internal: false
    id: emu_pv_current
    name: "PV Current"
    unit_of_measurement: "A"
    accuracy_decimals: 2

  - platform: template
