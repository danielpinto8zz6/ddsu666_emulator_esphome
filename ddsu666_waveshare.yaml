esphome:
  name: ddsu666-emulator-waveshare
  build_flags:
    - -DCONFIG_ARDUINO_ISR_IRAM
    - -Wno-empty-body
  on_boot:
    priority: 800
    then:
      - lambda: |-
          // Safe boot defaults: zero power so inverter doesn't charge battery
          // Energy counters keep last known values (will be updated via MQTT)
          id(emu_import_kwh).publish_state(0.0);
          id(emu_export_kwh).publish_state(0.0);
          id(emu_voltage).publish_state(230.0);
          id(emu_current).publish_state(0.0);
          id(emu_active_power).publish_state(0.0);
          id(emu_reactive_power).publish_state(0.0);
          id(emu_apparent_power).publish_state(0.0);
          id(emu_pf).publish_state(1.0);
          id(emu_freq).publish_state(50.0);
          id(emu_pv_import_kwh).publish_state(0.0);
          id(emu_pv_export_kwh).publish_state(0.0);
          id(emu_pv_voltage).publish_state(230.0);
          id(emu_pv_current).publish_state(0.0);
          id(emu_pv_active_power).publish_state(0.0);
          id(emu_pv_reactive_power).publish_state(0.0);
          id(emu_pv_apparent_power).publish_state(0.0);
          id(emu_pv_pf).publish_state(1.0);
          id(emu_pv_freq).publish_state(50.0);

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  level: INFO
  logs:
    mqtt.component: WARN
    mqtt.sensor: WARN

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Lisbon"

globals:
  - id: mqtt_grid_watchdog
    type: int
    initial_value: '0'
  - id: mqtt_pv_watchdog
    type: int
    initial_value: '0'
  - id: rs485_enabled
    type: bool
    initial_value: 'true'

interval:
  - interval: 1s
    then:
      - lambda: |-
          id(mqtt_grid_watchdog) += 1;
          id(mqtt_pv_watchdog) += 1;
          // Reduced from 30s to 10s for faster failsafe response
          if (id(mqtt_grid_watchdog) > 10) {
            ESP_LOGW("failsafe", "Grid MQTT timeout! Disabling RS485 to force Hoymiles safe state.");
            id(rs485_enabled) = false;
            id(modbus_srv_grid).set_address(99);
            id(modbus_srv_pv).set_address(99);
            id(mqtt_grid_watchdog) = 15;
          }
          if (id(mqtt_pv_watchdog) > 10) {
            id(emu_pv_active_power).publish_state(0.0);
            id(emu_pv_apparent_power).publish_state(0.0);
            id(emu_pv_reactive_power).publish_state(0.0);
            id(emu_pv_current).publish_state(0.0);
            id(mqtt_pv_watchdog) = 15;
          }

  # Lightweight MQTT health check (replaces web_server)
  - interval: 30s
    then:
      - lambda: |-
          char buf[128];
          int rssi = 0;
          if (wifi::global_wifi_component->is_connected()) {
            rssi = wifi::global_wifi_component->wifi_rssi();
          }
          snprintf(buf, sizeof(buf),
            "{\"rssi\":%d,\"rs485_status\":%s}",
            rssi,
            id(rs485_enabled) ? "true" : "false"
          );
          id(mqtt_bus).publish("ddsu666-emulator/status", buf);

# --- Wi-Fi Configuration ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  reboot_timeout: 15min

  on_disconnect:
    then:
      - lambda: |-
          ESP_LOGW("wifi", "WiFi disconnected! Disabling RS485 to force Hoymiles safe state.");
          // Change Modbus address to simulate a hardware disconnection ('Meter Lost' alarm)
          // This prevents the PID loop from freezing at its current discharge rate
          id(rs485_enabled) = false;
          id(modbus_srv_grid).set_address(99);
          id(modbus_srv_pv).set_address(99);
          // PV can safely report 0
          id(emu_pv_active_power).publish_state(0.0);
          id(emu_pv_apparent_power).publish_state(0.0);
          id(emu_pv_reactive_power).publish_state(0.0);
          id(emu_pv_current).publish_state(0.0);
          // Force watchdogs into timeout state
          id(mqtt_grid_watchdog) = 15;
          id(mqtt_pv_watchdog) = 15;

  # Optional fallback hotspot if it fails to connect to the primary Wi-Fi
  ap:
    ssid: "DDSU666-Emulator-Fallback"
    password: ""

# captive_portal removed — not useful on a headless Modbus bridge, saves RAM

# Standard ESPHome Over-The-Air updates
ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  id: mqtt_bus
  broker: 10.0.0.4
  port: 1883
  client_id: "ddsu666-emulator"

  on_disconnect:
    then:
      - lambda: |-
          ESP_LOGW("mqtt", "MQTT disconnected! Disabling RS485 to force Hoymiles safe state.");
          id(rs485_enabled) = false;
          id(modbus_srv_grid).set_address(99);
          id(modbus_srv_pv).set_address(99);
          id(emu_pv_active_power).publish_state(0.0);
          id(emu_pv_apparent_power).publish_state(0.0);
          id(emu_pv_reactive_power).publish_state(0.0);
          id(emu_pv_current).publish_state(0.0);
          id(mqtt_grid_watchdog) = 15;
          id(mqtt_pv_watchdog) = 15;

  on_message:
    # ----------------------------------------------------
    # UPDATE THIS TOPIC TO MATCH YOUR OPENDTU POWER TOPIC!
    # Example: "solar/dtu/power" or "solar/11223344/0/power"
    # ----------------------------------------------------
    - topic: "solar/ac/power"
      then:
        - lambda: |-
            float p = atof(x.c_str());
            // Sanity check: reject garbage values (PV can't exceed 10 kW)
            if (isnan(p) || p < 0.0 || p > 10000.0) {
              ESP_LOGW("pv", "Rejected bad PV power value: %f", p);
              return;
            }
            id(mqtt_pv_watchdog) = 0; // Reset PV watchdog only on valid data
            id(emu_pv_active_power).publish_state(p / 1000.0);
            id(emu_pv_voltage).publish_state(230.0);
            id(emu_pv_apparent_power).publish_state(p / 1000.0);
            id(emu_pv_reactive_power).publish_state(0.0);
            id(emu_pv_pf).publish_state(1.0);
            id(emu_pv_current).publish_state(p / 230.0);
            id(emu_pv_freq).publish_state(50.0);

    # ----------------------------------------------------
    # UPDATE THIS TOPIC TO MATCH YOUR OPENDTU ENERGY TOPIC!
    # ----------------------------------------------------
    - topic: "solar/ac/yieldtotal"
      then:
        - lambda: |-
            float e = atof(x.c_str());
            if (!isnan(e) && e >= 0.0) {
              id(emu_pv_import_kwh).publish_state(e);
            }

  on_json_message:
    - topic: "shelly-em/realtime"
      then:
        - lambda: |-
            // Validate voltage first — if it's garbage, reject the entire message
            if (!x["v"].isNull()) {
              float v = x["v"];
              if (isnan(v) || v < 180.0 || v > 280.0) {
                ESP_LOGW("grid", "Rejected bad voltage: %f — skipping entire message", v);
                return;
              }
              id(emu_voltage).publish_state(v);
            }
            id(mqtt_grid_watchdog) = 0; // Reset only after validation
            if (!id(rs485_enabled)) {
              ESP_LOGI("failsafe", "Grid data received! Re-enabling RS485 responses.");
              id(rs485_enabled) = true;
              id(modbus_srv_grid).set_address(2);
              id(modbus_srv_pv).set_address(1);
            }
            
            if (!x["c"].isNull()) {
              float c = x["c"];
              if (!isnan(c) && c >= 0.0 && c < 250.0) {
                id(emu_current).publish_state(c);
              }
            }
            if (!x["p"].isNull()) {
              float p = x["p"];
              // Grid power can be -15kW to +15kW (import/export)
              if (!isnan(p) && p > -15000.0 && p < 15000.0) {
                id(emu_active_power).publish_state((p / 1000.0) * -1.0); // INVERT SIGN FOR HOYMILES
              }
            }
            if (!x["s"].isNull()) {
              float s = x["s"];
              if (!isnan(s) && s >= 0.0 && s < 15000.0) {
                id(emu_apparent_power).publish_state(s / 1000.0);
                float p_abs = fabs(id(emu_active_power).state);
                float s_kw = s / 1000.0;
                // NaN-safe reactive power: only sqrt if s > p (avoid negative under root)
                if (s_kw > p_abs) {
                  id(emu_reactive_power).publish_state(sqrt(s_kw * s_kw - p_abs * p_abs));
                } else {
                  id(emu_reactive_power).publish_state(0.0);
                }
              }
            }
            if (!x["pf"].isNull()) {
              float pf = x["pf"];
              if (!isnan(pf) && pf >= -1.0 && pf <= 1.0) {
                id(emu_pf).publish_state(pf);
              }
            }
            if (!x["f"].isNull()) {
              float f = x["f"];
              if (!isnan(f) && f > 45.0 && f < 55.0) {
                id(emu_freq).publish_state(f);
              }
            }
            
    - topic: "shelly-em/status/em1data:0"
      then:
        - lambda: |-
            if (!x["total_act_energy"].isNull()) {
              float e = x["total_act_energy"];
              id(emu_import_kwh).publish_state(e / 1000.0); // Assuming Wh, convert to kWh
            }
            if (!x["total_act_ret_energy"].isNull()) {
              float e = x["total_act_ret_energy"];
              id(emu_export_kwh).publish_state(e / 1000.0);
            }

# Local web server for the dashboard
web_server:
  port: 80
  version: 2

# ESPHome Native API for Home Assistant and ESPHome Dashboard connection
api:

# Note: Waveshare ESP32-S3-RS485-CAN has fixed power, no hardware enable pins.
# Failsafe logic now modifies the Modbus address to simulate a hardware fault.

# Configure UART using Waveshare ESP32-S3-RS485-CAN pin mappings
uart:
  - id: uart_modbus
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 9600
    stop_bits: 1

# Configure Modbus with direction control on GPIO21
modbus:
  - id: modbus_bus
    uart_id: uart_modbus
    flow_control_pin: GPIO21
    role: server

modbus_server:
  # --- GRID METER EMULATOR ---
  - id: modbus_srv_grid
    modbus_id: modbus_bus
    address: 2 # DDSU666 Modbus Slave ID (fixed for Hoymiles)
    registers:
      # --- System / Information Registers (16-bit Integer) ---
      - address: 0x0001
        value_type: U_WORD
        read_lambda: return 504;

      - address: 0x0002
        value_type: U_WORD
        read_lambda: return 0;

      - address: 0x0003
        value_type: U_WORD
        read_lambda: return 166;

      - address: 0x0004
        value_type: U_WORD
        read_lambda: return 5;

      - address: 0x0005
        value_type: U_WORD
        read_lambda: return 5;

      - address: 0x0006
        value_type: U_WORD
        read_lambda: return 3;

      - address: 0x0007
        value_type: U_WORD
        read_lambda: return 10;

      - address: 0x0008
        value_type: U_WORD
        read_lambda: return 1;

      - address: 0x0009
        value_type: U_WORD
        read_lambda: return 5;

      - address: 0x000A
        value_type: U_WORD
        read_lambda: return 0;

      - address: 0x000B
        value_type: U_WORD
        read_lambda: return 166;

      - address: 0x000C
        value_type: U_WORD
        read_lambda: return 3;

      # --- Real-Time Measurement Registers (32-bit Float IEEE754) ---
      - address: 0x2000
        value_type: FP32
        read_lambda: return id(emu_voltage).state;

      - address: 0x2002
        value_type: FP32
        read_lambda: return id(emu_current).state;

      - address: 0x2004
        value_type: FP32
        read_lambda: return id(emu_active_power).state;

      - address: 0x2006
        value_type: FP32
        read_lambda: return id(emu_reactive_power).state;

      - address: 0x2008
        value_type: FP32
        read_lambda: return id(emu_apparent_power).state;

      - address: 0x200A
        value_type: FP32
        read_lambda: return id(emu_pf).state;

      - address: 0x200E
        value_type: FP32
        read_lambda: return id(emu_freq).state;

      # --- Total Energy Accumulator Registers ---
      - address: 0x4000
        value_type: FP32
        read_lambda: return id(emu_import_kwh).state;

      - address: 0x4002
        value_type: FP32
        read_lambda: return 0.0;

      - address: 0x4004
        value_type: FP32
        read_lambda: return 0.0;

      - address: 0x4006
        value_type: FP32
        read_lambda: return 0.0;

      - address: 0x4008
        value_type: FP32
        read_lambda: return 0.0;

      - address: 0x400A
        value_type: FP32
        read_lambda: return id(emu_export_kwh).state;

  # --- PV METER EMULATOR ---
  - id: modbus_srv_pv
    modbus_id: modbus_bus
    address: 1 # DDSU666 Modbus Slave ID for PV
    registers:
      - address: 0x0001
        value_type: U_WORD
        read_lambda: return 504;
      - address: 0x0002
        value_type: U_WORD
        read_lambda: return 0;
      - address: 0x0003
        value_type: U_WORD
        read_lambda: return 166;
      - address: 0x0004
        value_type: U_WORD
        read_lambda: return 5;
      - address: 0x0005
        value_type: U_WORD
        read_lambda: return 5;
      - address: 0x0006
        value_type: U_WORD
        read_lambda: return 3;
      - address: 0x0007
        value_type: U_WORD
        read_lambda: return 10;
      - address: 0x0008
        value_type: U_WORD
        read_lambda: return 1;
      - address: 0x0009
        value_type: U_WORD
        read_lambda: return 5;
      - address: 0x000A
        value_type: U_WORD
        read_lambda: return 0;
      - address: 0x000B
        value_type: U_WORD
        read_lambda: return 166;
      - address: 0x000C
        value_type: U_WORD
        read_lambda: return 3;

      - address: 0x2000
        value_type: FP32
        read_lambda: return id(emu_pv_voltage).state;
      - address: 0x2002
        value_type: FP32
        read_lambda: return id(emu_pv_current).state;
      - address: 0x2004
        value_type: FP32
        read_lambda: return id(emu_pv_active_power).state;
      - address: 0x2006
        value_type: FP32
        read_lambda: return id(emu_pv_reactive_power).state;
      - address: 0x2008
        value_type: FP32
        read_lambda: return id(emu_pv_apparent_power).state;
      - address: 0x200A
        value_type: FP32
        read_lambda: return id(emu_pv_pf).state;
      - address: 0x200E
        value_type: FP32
        read_lambda: return id(emu_pv_freq).state;

      - address: 0x4000
        value_type: FP32
        read_lambda: return id(emu_pv_import_kwh).state;
      - address: 0x4002
        value_type: FP32
        read_lambda: return 0.0;
      - address: 0x4004
        value_type: FP32
        read_lambda: return 0.0;
      - address: 0x4006
        value_type: FP32
        read_lambda: return 0.0;
      - address: 0x4008
        value_type: FP32
        read_lambda: return 0.0;
      - address: 0x400A
        value_type: FP32
        read_lambda: return id(emu_pv_export_kwh).state;

# Entities exposed on Home Assistant and Web Interface
