[platformio]
default_envs = minimal-ota-lilygo

[env:minimal-ota-lilygo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
    -Os
    -Wl,--gc-sections
    -I../include

[env:minimal-ota-lilygo-upload]
extends = env:minimal-ota-lilygo
upload_protocol = esptool
upload_port = /dev/ttyUSB0
