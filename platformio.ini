[platformio]
default_envs = xiao-esp32-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    knolleary/PubSubClient @ ^2.8
    links2004/WebSockets @ ^2.7.3

# ================================================================
# 1. LILYGO T-CAN485 (ESP32) - TARGET BOARD
# TX: GPIO22 | RX: GPIO21 | DE/RE: GPIO17 | 5V: GPIO16 | EN: GPIO19
# ================================================================
[env:lilygo-t-can485]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    -Os
    -Wl,--gc-sections
    -DCONFIG_ARDUINO_ISR_IRAM
    -DBOARD_LILYGO_TCAN485

[env:lilygo-t-can485-ota]
extends = env:lilygo-t-can485
upload_protocol = custom
upload_command = curl -u "admin:admin" -F "file=@$SOURCE" -H "Expect:" http://10.0.0.110/update?password=admin

# ================================================================
# 2. Waveshare ESP32-S3 RS485/CAN (Alternative Board)
# TX: GPIO17 | RX: GPIO18 | DE/RE: GPIO21
# ================================================================
[env:waveshare-esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    -Os
    -Wl,--gc-sections
    -DCONFIG_ARDUINO_ISR_IRAM
    -DBOARD_WAVESHARE_ESP32S3

[env:waveshare-esp32-s3-ota]
extends = env:waveshare-esp32-s3
upload_protocol = custom
upload_command = curl -u "admin:admin" -F "file=@$SOURCE" -H "Expect:" http://10.0.0.110/update?password=admin

# ================================================================
# 3. Seeed Studio XIAO ESP32-S3 + XIAO RS485 Expansion Board
# TX: GPIO5 (D4) | RX: GPIO6 (D5) | DE/RE: GPIO3 (D2)
# ================================================================
[env:xiao-esp32-s3]
board = seeed_xiao_esp32s3
board_build.partitions = default_8MB.csv
build_flags =
    -Os
    -Wl,--gc-sections
    -DCONFIG_ARDUINO_ISR_IRAM
    -DBOARD_XIAO_ESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:xiao-esp32-s3-ota]
extends = env:xiao-esp32-s3
upload_protocol = custom
upload_command = curl -u "admin:admin" -F "file=@$SOURCE" -H "Expect:" http://10.0.0.169/update?password=admin

# ================================================================
# 4. Seeed Studio XIAO ESP32-S3 (Chint DDSU666 Modbus Master & WS)
# ================================================================
[env:chint-reader-xiao-s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = +<../chint_ddsu666_reader/src/*> -<*>
build_flags =
    -I chint_ddsu666_reader/include
    -I include
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_XIAO_ESP32S3
    -DWEBSOCKETS_SERVER_CLIENT_MAX=8
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    links2004/WebSockets @ ^2.7.3
    knolleary/PubSubClient @ ^2.8

[env:chint-reader-xiao-s3-ota]
extends = env:chint-reader-xiao-s3
upload_protocol = custom
upload_command = curl -u "admin:admin" -F "file=@$SOURCE" -H "Expect:" http://10.0.0.197/update?password=admin
