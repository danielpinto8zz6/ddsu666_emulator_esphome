[platformio]
default_envs = lilygo-t-can485

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    knolleary/PubSubClient @ ^2.8
    links2004/WebSockets @ ^2.7.3

# ================================================================
# 1. LILYGO T-CAN485 (ESP32) - TARGET BOARD
# TX: GPIO22 | RX: GPIO21 | DE/RE: GPIO17 | 5V: GPIO16 | EN: GPIO19
# ================================================================
[env:lilygo-t-can485]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    -Os
    -Wl,--gc-sections
    -DCONFIG_ARDUINO_ISR_IRAM
    -DBOARD_LILYGO_TCAN485

[env:lilygo-t-can485-ota]
extends = env:lilygo-t-can485
upload_protocol = custom
upload_command = curl -F "file=@$SOURCE" -H "Expect:" http://10.0.0.110/update

# ================================================================
# 2. Waveshare ESP32-S3 RS485/CAN (Alternative Board)
# TX: GPIO17 | RX: GPIO18 | DE/RE: GPIO21
# ================================================================
[env:waveshare-esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    -Os
    -Wl,--gc-sections
    -DCONFIG_ARDUINO_ISR_IRAM
    -DBOARD_WAVESHARE_ESP32S3

[env:waveshare-esp32-s3-ota]
extends = env:waveshare-esp32-s3
upload_protocol = custom
upload_command = curl -F "file=@$SOURCE" http://10.0.0.110/update

# ================================================================
# 3. ESP32-C3 SuperMini (Shelly WebSocket -> ESP-NOW Transmitter)
# ================================================================
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<../shelly_espnow_transmitter/src/*> -<*>
build_flags =
    -I shelly_espnow_transmitter/include
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_ESP32C3_SUPERMINI
    -DSTATUS_LED_PIN=8
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    links2004/WebSockets @ ^2.7.3

[env:esp32-c3-supermini-ota]
extends = env:esp32-c3-supermini
upload_protocol = custom
upload_command = curl -F "file=@$SOURCE" -H "Expect:" http://10.0.0.125/update

# Backwards-compatible aliases
[env:lolin-c3-mini]
extends = env:esp32-c3-supermini

[env:lolin-c3-mini-ota]
extends = env:esp32-c3-supermini-ota


